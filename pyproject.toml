# Development workspace only: each tool is published from its own folder under packages/.
[project]
name = "mcpbytes-tools"
version = "0"
requires-python = ">=3.11,<3.14"
dependencies = ["mcpbytes-core", "mcpbytes-pixel-sprite"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]
# image-to-3d runs Hunyuan3D 2.1's older ML stack (transformers 4.46), which cannot share one lock with
# pixel-sprite's: it keeps its own environment (see README).
exclude = ["packages/image-to-3d"]

[tool.uv.sources]
mcpbytes-core = { workspace = true }
mcpbytes-pixel-sprite = { workspace = true }
# CUDA wheels for development. Published packages cannot name an index: users pass --torch-backend.
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib --ignore=packages/image-to-3d"
